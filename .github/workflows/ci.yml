name: Go

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod tidy
      - run: make build check test
      - run: ./bin/rexp --help
      - run: ./bin/rexp --version
